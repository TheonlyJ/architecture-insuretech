# Корневой тип запросов
type Query {
  """
  Получить информацию о клиенте по ID.
  """
  client(id: ID!): Client!
}

# Основная сущность: клиент
type Client {
  """
  Уникальный идентификатор клиента
  """
  id: ID!

  """
  ФИО клиента
  """
  name: String

  """
  Возраст клиента
  """
  age: Int

  """
  Список документов клиента
  """
  documents(
    """
    Максимальное количество документов
    """
    limit: Int

    """
    Смещение для пагинации
    """
    offset: Int

    """
    Фильтр по типу документа
    """
    type: String
  ): [Document!]!

  """
  Список родственников клиента
  """
  relatives(
    """
    Максимальное количество родственников
    """
    limit: Int

    """
    Смещение для пагинации
    """
    offset: Int

    """
    Фильтр по типу родства
    """
    relationType: String
  ): [Relative!]!
}

# Документ клиента
type Document {
  """
  Уникальный идентификатор документа
  """
  id: ID!

  """
  Тип документа
  """
  type: String

  """
  Номер документа
  """
  number: String

  """
  Дата выдачи
  """
  issueDate: String

  """
  Дата окончания действия
  """
  expiryDate: String
}

# Родственник клиента
type Relative {
  """
  Уникальный идентификатор родственника
  """
  id: ID!

  """
  Тип родства
  """
  relationType: String

  """
  Имя родственника
  """
  name: String

  """
  Возраст родственника
  """
  age: Int
}